<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>F1Stories — Working viewport preview</title><link rel="stylesheet" href="review.css"></head><body><div class="frame-controls"><a href="/">← Comparison</a><label>Concept <select id="concept"><option value="a">A · Grand Prix Journal</option><option value="b">B · Paddock</option><option value="c">C · Race Notebook</option></select></label><label>Page <select id="page"><option value="homepage">Homepage</option><option value="article">Article</option><option value="data-hub">Data Hub</option></select></label><label>Width <select id="width"><option>390</option><option>768</option><option>1440</option></select></label><a id="direct" href="/concept-a/" target="_blank">Open directly ↗</a></div><p class="frame-hint" id="hint"></p><div class="frame-wrap"><iframe title="Working F1Stories concept preview"></iframe></div><script>
const q=new URLSearchParams(location.search), routes={homepage:'index.html',article:'article.html','data-hub':'data.html'};for(const id of ['concept','page','width']){const el=document.getElementById(id);if([...el.options].some(o=>o.value===q.get(id)))el.value=q.get(id)}
function size(){const width=Number(document.getElementById('width').value),height=width===390?844:900,scale=Math.min(1,(innerWidth-40)/width),frame=document.querySelector('iframe'),wrap=document.querySelector('.frame-wrap');frame.width=width;frame.height=height;frame.style.transform=`scale(${scale})`;wrap.style.width=`${width*scale}px`;wrap.style.height=`${height*scale}px`;document.getElementById('hint').textContent=`Live page at ${width} × ${height} CSS pixels · ${Math.round(scale*100)}% display scale · scroll inside the preview`}
function load(){const c=document.getElementById('concept').value,p=document.getElementById('page').value,w=document.getElementById('width').value,url=`/concept-${c}/${routes[p]}`;document.querySelector('iframe').src=url;document.getElementById('direct').href=url;history.replaceState(null,'',`?concept=${c}&page=${p}&width=${w}`);size()}
for(const id of ['concept','page','width'])document.getElementById(id).addEventListener('change',load);addEventListener('resize',size);load();
</script></body></html>
