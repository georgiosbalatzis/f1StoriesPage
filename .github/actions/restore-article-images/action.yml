name: Restore optimized article images
description: >-
  Restore-only: PR jobs reuse main's optimized images but never save a cache that deployment could read.
  Entries are content-addressed and digest-checked, so a stale or partial restore is only a cache miss.

runs:
  using: composite
  steps:
    # Keep this key identical to the one in .github/actions/build-pages (quality-routing.test.mjs checks it).
    - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .build/public-images
        key: public-images-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build/public-article-images.mjs') }}-${{ hashFiles('package-lock.json', 'blog-module/blog-entries/**/*.webp', 'blog-module/blog-entries/**/*.avif', 'blog-module/blog-source-cache.json', 'blog-module/taxonomy.js', 'blog-module/media-metadata.json', 'blog-module/build/media-meta.js', 'scripts/build/social-cards.mjs', 'scripts/build/assets/*', 'docs/design-tokens.json', 'images/logo-256.webp') }}
        restore-keys: |
          public-images-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build/public-article-images.mjs') }}-
