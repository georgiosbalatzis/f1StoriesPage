name: Scheduled Publish

# Merges scheduled author PRs (branch author/scheduled/**, opened by generate.html
# with "Προγραμματισμένα") once the publish time in their body has passed and
# Site Quality is green, then hands off to Site Maintenance (task=blog).
# Publish Article ignores these branches, so nothing merges before its time.
#
# The PR body carries the UTC time as a hidden marker (see publishAtMarker in
# scripts/author/github-client.js):  <!-- f1s-publish-at: 2026-10-01T09:00:00Z -->
# Edit the marker to reschedule; close the PR or mark it draft to cancel.
# A PR goes out on the first run at or after its time, so the effective publish
# slots are 09:00 and 18:00 Europe/Athens (generate.html shows the author which slot).

on:
  schedule:
    # 09:00 and 18:00 Europe/Athens. GitHub cron is UTC, so both EET and EEST
    # offsets are scheduled and the job keeps the matching one.
    # Keep in sync with PUBLISH_HOURS_ATHENS in scripts/author/generate-page.js.
    - cron: '0 6 * * *'
    - cron: '0 7 * * *'
    - cron: '0 15 * * *'
    - cron: '0 16 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: scheduled-publish
  cancel-in-progress: false

jobs:
  merge:
    name: Merge due scheduled PRs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
      checks: read
    outputs:
      merged: ${{ steps.due.outputs.merged }}
    steps:
      - name: Check Athens schedule window
        id: schedule_window
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -eu
          if [ -z "$SCHEDULE" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Same cron-slot rule as Site Maintenance: decide from the slot that fired,
          # not the wall clock, and keep only the one matching today's UTC offset.
          offset_hours=$((10#$(TZ=Europe/Athens date +%z | cut -c2-3)))
          read -r _ cron_hour _ <<< "$SCHEDULE"
          athens_hour=$(( (10#$cron_hour + offset_hours) % 24 ))
          should_run=false
          if [ "$athens_hour" = "9" ] || [ "$athens_hour" = "18" ]; then
            should_run=true
          fi

          echo "Schedule '$SCHEDULE' → Athens hour $athens_hour (UTC+$offset_hours), run=$should_run"
          echo "run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Find and merge due PRs
        id: due
        if: ${{ steps.schedule_window.outputs.run == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu

          now="$(date -u +%s)"
          merged=false
          failed=false

          gh api --paginate "repos/$REPO/pulls?state=open&base=main&per_page=100" > pulls.json
          jq -c --arg repo "$REPO" '.[]
            | select(.head.ref | startswith("author/scheduled/"))
            | select(.draft == false and .head.repo.full_name == $repo)
            | { number, sha: .head.sha, at: ((.body // "")
                | capture("<!--\\s*f1s-publish-at:\\s*(?<t>[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}(:[0-9]{2})?Z)\\s*-->").t // "") }' \
            pulls.json > scheduled.jsonl

          if [ ! -s scheduled.jsonl ]; then
            echo "No scheduled author PRs."
          fi

          while IFS= read -r pr; do
            number="$(printf '%s' "$pr" | jq -r '.number')"
            sha="$(printf '%s' "$pr" | jq -r '.sha')"
            at="$(printf '%s' "$pr" | jq -r '.at')"

            if [ -z "$at" ] || ! due="$(date -u -d "$at" +%s 2>/dev/null)"; then
              echo "::warning::PR #$number has no valid f1s-publish-at marker; skipping."
              continue
            fi
            if [ "$due" -gt "$now" ]; then
              echo "PR #$number is scheduled for $at; not yet."
              continue
            fi

            quality="$(gh api "repos/$REPO/commits/$sha/check-runs?check_name=Quality%20gates&filter=latest" \
              --jq '.check_runs | sort_by(.started_at) | last | .conclusion // "pending"')"
            if [ "$quality" != "success" ]; then
              echo "::warning::PR #$number is due ($at) but Site Quality is '${quality:-missing}' on $sha; waiting."
              continue
            fi

            files="$(gh api --paginate "repos/$REPO/pulls/$number/files" --jq '.[].filename')"
            invalid_files="$(printf '%s\n' "$files" | awk 'NF && $0 !~ /^blog-module\/blog-entries\//')"
            if [ -z "$files" ] || [ -n "$invalid_files" ]; then
              echo "::error::PR #$number is empty or changes files outside blog entries:"
              printf '%s\n' "$invalid_files"
              failed=true
              continue
            fi

            echo "Merging PR #$number (scheduled for $at)."
            if gh pr merge "$number" --repo "$REPO" --merge --delete-branch --match-head-commit "$sha"; then
              merged=true
            else
              echo "::error::Could not merge PR #$number."
              failed=true
            fi
          done < scheduled.jsonl

          echo "merged=$merged" >> "$GITHUB_OUTPUT"
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Report failed scheduled PRs
        if: ${{ steps.due.outputs.failed == 'true' }}
        run: |
          echo "::error::At least one due scheduled PR could not be merged; see the step above."
          exit 1

  publish:
    name: Build and deploy articles
    needs: merge
    # Deploy whatever did merge, even if another due PR failed.
    if: ${{ always() && needs.merge.outputs.merged == 'true' }}
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/publish-blog.yml
    with:
      task: blog
