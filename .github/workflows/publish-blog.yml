name: Site Maintenance

# Owns generated content maintenance: blog artifacts, standings data, and the YouTube snapshot.
# Scheduled jobs are split by cron through job-level conditions. Push events
# only run the blog publisher for article changes. Publish Article calls this
# workflow with task=blog after merging an author PR.
# The blog build is offline; the standings job is the only one that fetches F1 data.

on:
  schedule:
    # YouTube snapshot: Saturday 23:59 Europe/Athens. GitHub cron is UTC, so both
    # EET and EEST offsets are scheduled and the job keeps the matching one.
    - cron: '59 20 * * 6'
    - cron: '59 21 * * 6'
    # Standings refresh: Friday 23:59, Saturday 07:01 and Monday 07:01 Europe/Athens
    # (after practice, after qualifying, after the race). GitHub cron is UTC, so
    # both EET and EEST offsets are scheduled and the job keeps the matching one.
    - cron: '59 20 * * 5'
    - cron: '59 21 * * 5'
    - cron: '1 4 * * 6'
    - cron: '1 5 * * 6'
    - cron: '1 4 * * 1'
    - cron: '1 5 * * 1'
  push:
    branches: [main]
    paths:
      - 'blog-module/blog-entries/**'
      - 'blog-module/blog-processor.js'
      - 'blog-module/blog/template.html'
      - '.github/workflows/publish-blog.yml'
  workflow_call:
    inputs:
      task:
        description: 'Maintenance task to run'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      task:
        description: 'Maintenance task to run'
        required: true
        default: 'blog'
        type: choice
        options:
          - blog
          - standings
          - youtube

permissions:
  contents: write

jobs:
  publish_blog:
    name: Publish blog artifacts
    if: >-
      ${{
        github.event_name == 'push' ||
        inputs.task == 'blog'
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: content-publishing
      queue: max
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: ./.github/actions/setup

      - name: Restore git mtimes for blog entries
        # actions/checkout sets every file's mtime to the checkout time, so the
        # blog processor's mtime-based skip check can't tell that source.txt was
        # edited in a later commit than article.html — and silently skips the
        # rebuild. Restore each tracked file's mtime to the latest commit that
        # touched it so the skip check matches local-dev behaviour.
        run: |
          set -eu
          git log --pretty=tformat:'@%at' --name-only -- 'blog-module/blog-entries/' \
            | awk '
                /^@[0-9]+$/ { ts = substr($0, 2); next }
                NF == 0 { next }
                !seen[$0]++ { printf "%s\t%s\n", ts, $0 }
              ' \
            | while IFS=$'\t' read -r ts file; do
                # `git log` includes deleted/renamed files; skip them.
                # An `if` is used (not `&& touch`) so the loop body returns 0
                # even when the file is missing — otherwise the whole `while`
                # exits non-zero on the last skipped iteration and `set -e`
                # aborts the step.
                if [ -e "$file" ]; then
                  touch -m -d "@$ts" "$file"
                fi
              done

      - name: Run blog processor
        run: node blog-module/blog-processor.js

      - name: Stamp article runtime markup
        # The processor renders from the template; stamp-html applies the article
        # migrations and asset hashes, as build:public does locally. The sprite,
        # Bootstrap subset and minified hash manifest it reads are gitignored.
        # Sponsor normalization is skipped: its outputs are tracked images.
        run: |
          node scripts/build/build-icon-sprite.mjs
          npm run build:bootstrap
          node scripts/build/minify.mjs
          node scripts/build/stamp-html.mjs

      - name: Commit generated artifacts
        id: commit
        uses: ./.github/actions/commit-and-push
        with:
          message: 'chore(blog): auto-build generated artifacts [skip ci]'

  refresh_youtube:
    name: Refresh YouTube snapshot
    if: >-
      ${{
        contains(fromJSON('["59 20 * * 6", "59 21 * * 6"]'), github.event.schedule) ||
        inputs.task == 'youtube'
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: content-publishing
      queue: max
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Check Athens schedule window
        id: schedule_window
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -eu
          if [ -z "$SCHEDULE" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Same cron-slot rule as the standings job: keep only the Saturday 23:59
          # Athens slot that matches today's UTC offset.
          offset_hours=$((10#$(TZ=Europe/Athens date +%z | cut -c2-3)))
          read -r _ cron_hour _ <<< "$SCHEDULE"
          athens_hour=$(( (10#$cron_hour + offset_hours) % 24 ))
          should_run=false
          if [ "$athens_hour" = "23" ]; then
            should_run=true
          fi

          echo "Schedule '$SCHEDULE' → Athens hour $athens_hour (UTC+$offset_hours), run=$should_run"
          echo "run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        if: ${{ steps.schedule_window.outputs.run == 'true' }}
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - if: ${{ steps.schedule_window.outputs.run == 'true' }}
        uses: ./.github/actions/setup

      - name: Refresh YouTube snapshot
        if: ${{ steps.schedule_window.outputs.run == 'true' }}
        run: node scripts/build/fetch-youtube.mjs

      - name: Commit updated snapshot
        id: commit
        if: ${{ steps.schedule_window.outputs.run == 'true' }}
        uses: ./.github/actions/commit-and-push
        with:
          message: 'chore(data): refresh youtube snapshot [skip ci]'
          paths: assets/youtube-latest.json

  refresh_standings_data:
    name: Refresh standings data
    if: >-
      ${{
        (github.event_name == 'schedule' && !contains(fromJSON('["59 20 * * 6", "59 21 * * 6"]'), github.event.schedule)) ||
        inputs.task == 'standings'
      }}
    runs-on: ubuntu-latest
    concurrency:
      group: content-publishing
      queue: max
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Check Athens schedule window
        id: schedule_window
        shell: bash
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          set -eu
          if [ -z "$SCHEDULE" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Decide from the cron slot that fired, not the wall clock: GitHub often
          # starts scheduled runs hours late, and a wall-clock window then skips
          # every refresh. Each Athens slot (Fri 23:59, Sat/Mon 07:01) is scheduled for
          # both UTC offsets; only the slot matching today's offset runs.
          offset_hours=$((10#$(TZ=Europe/Athens date +%z | cut -c2-3)))
          read -r _ cron_hour _ <<< "$SCHEDULE"
          athens_hour=$(( (10#$cron_hour + offset_hours) % 24 ))
          should_run=false
          if [ "$athens_hour" = "23" ] || [ "$athens_hour" = "7" ]; then
            should_run=true
          fi

          echo "Schedule '$SCHEDULE' → Athens hour $athens_hour (UTC+$offset_hours), run=$should_run"
          echo "run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Checkout main
        if: ${{ steps.schedule_window.outputs.run == 'true' }}
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - if: ${{ steps.schedule_window.outputs.run == 'true' }}
        uses: ./.github/actions/setup

      - name: Refresh standings data
        if: ${{ steps.schedule_window.outputs.run == 'true' }}
        run: npm run build:standings-data

      - name: Commit updated standings data
        id: commit
        if: ${{ steps.schedule_window.outputs.run == 'true' }}
        uses: ./.github/actions/commit-and-push
        with:
          message: 'chore(data): refresh standings snapshots [skip ci]'
          paths: >-
            standings/standings-cache.json
            standings/dirty-air-cache.json
            standings/dirty-air
            standings/destructors-cache.json
            standings/debrief-cache.json

  deploy:
    name: Deploy changed maintenance content
    needs: [publish_blog, refresh_youtube, refresh_standings_data]
    if: >-
      ${{
        always() &&
        (
          needs.publish_blog.outputs.changed == 'true' ||
          needs.refresh_youtube.outputs.changed == 'true' ||
          needs.refresh_standings_data.outputs.changed == 'true'
        )
      }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
