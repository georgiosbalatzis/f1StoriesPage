name: Site Maintenance

# Owns generated content maintenance: blog artifacts, standings data, and the YouTube snapshot.
# Scheduled jobs are split by cron through job-level conditions. This is the
# sole main-push entry point: regenerate blog content when needed, then deploy once.
# Publish Article calls this
# workflow with task=blog after merging an author PR.
# The blog build is offline; the standings job is the only one that fetches F1 data.

on:
  schedule:
    # Local Athens schedules follow daylight saving time automatically.
    # YouTube snapshot: Saturday 23:59.
    - cron: '59 23 * * 6'
      timezone: Europe/Athens
    # Standings refresh: Friday 23:59, Saturday 07:01 and Monday 07:01 Europe/Athens
    # (after practice, after qualifying, after the race).
    - cron: '59 23 * * 5'
      timezone: Europe/Athens
    - cron: '1 7 * * 1,6'
      timezone: Europe/Athens
  push:
    branches: [main]
  workflow_call:
    inputs:
      task:
        description: 'Maintenance task to run'
        required: true
        type: string
  workflow_dispatch:
    inputs:
      task:
        description: 'Maintenance task to run'
        required: true
        default: 'blog'
        type: choice
        options:
          - blog
          - standings
          - youtube

# Fetch jobs are read-only and do not hold the article publishing lock.
# publish_blog and publish_data serialize their commits to main; the write
# token is handed to the push step only (persist-credentials: false).
permissions: {}

jobs:
  changes:
    name: Route main push
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      blog: ${{ steps.paths.outputs.blog }}
    steps:
      - name: Detect blog changes
        id: paths
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -eu
          # A new branch or unavailable/truncated comparison conservatively rebuilds.
          blog=true
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            if gh api "repos/$REPO/compare/$BEFORE...$AFTER" > comparison.json; then
              blog="$(jq -r '
                (.files | length) >= 300 or
                any(.files[];
                  [.filename, (.previous_filename // "")]
                  | any(test("^(blog-module/blog-entries/|blog-module/blog-processor\\.js$|blog-module/build/(?!__tests__/)|blog-module/taxonomy\\.js$|blog-module/blog/template\\.html$|\\.github/workflows/publish-blog\\.yml$)"))
                )' comparison.json)"
            fi
          fi
          echo "blog=$blog" >> "$GITHUB_OUTPUT"

  publish_blog:
    name: Publish blog artifacts
    needs: changes
    permissions:
      contents: write
      pages: read # configure-pages reads the Pages site while preparing the artifact
    if: >-
      ${{
        !cancelled() &&
        (
          (github.event_name == 'push' && needs.changes.outputs.blog == 'true') ||
          inputs.task == 'blog'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: content-publishing
      queue: max
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      artifact_ready: ${{ steps.pages.outcome == 'success' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        id: setup

      - name: Restore git mtimes for blog entries
        # actions/checkout sets every file's mtime to the checkout time, so the
        # blog processor's mtime-based skip check can't tell that source.txt was
        # edited in a later commit than article.html — and silently skips the
        # rebuild. Restore each tracked file's mtime to the latest commit that
        # touched it so the skip check matches local-dev behaviour.
        run: |
          set -eu
          git log --pretty=tformat:'@%at' --name-only -- 'blog-module/blog-entries/' \
            | awk '
                /^@[0-9]+$/ { ts = substr($0, 2); next }
                NF == 0 { next }
                !seen[$0]++ { printf "%s\t%s\n", ts, $0 }
              ' \
            | while IFS=$'\t' read -r ts file; do
                # `git log` includes deleted/renamed files; skip them.
                # An `if` is used (not `&& touch`) so the loop body returns 0
                # even when the file is missing — otherwise the whole `while`
                # exits non-zero on the last skipped iteration and `set -e`
                # aborts the step.
                if [ -e "$file" ]; then
                  touch -m -d "@$ts" "$file"
                fi
              done

      - name: Run blog processor
        run: node blog-module/blog-processor.js

      - name: Stamp article runtime markup
        # The processor renders from the template; stamp-html applies the article
        # migrations and asset hashes, as build:public does locally. The sprite,
        # Bootstrap subset and minified hash manifest it reads are gitignored.
        # Sponsor normalization is skipped: its outputs are tracked images.
        run: |
          node scripts/build/build-icon-sprite.mjs
          npm run build:bootstrap
          node scripts/build/minify.mjs
          node scripts/build/stamp-html.mjs

      - name: Commit generated artifacts
        id: commit
        uses: ./.github/actions/commit-and-push
        with:
          message: 'chore(blog): auto-build generated artifacts [skip ci]'
          token: ${{ github.token }}

      # Reuse this checkout and npm install after the commit/rebase. Artifact
      # preparation still runs all Pages checks and sees the resulting main tree.
      - name: Prepare Pages from published checkout
        id: pages
        if: ${{ github.event_name == 'push' || steps.commit.outputs.changed == 'true' }}
        uses: ./.github/actions/build-pages
        with:
          dependency_hash: ${{ steps.setup.outputs.dependency_hash }}

  refresh_youtube:
    name: Refresh YouTube snapshot
    permissions:
      contents: read
    if: >-
      ${{
        (github.event_name == 'schedule' && github.event.schedule == '59 23 * * 6') ||
        inputs.task == 'youtube'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: youtube-fetch
      queue: max
    outputs:
      patch: ${{ steps.patch.outputs.changed }}
      artifact: ${{ steps.snapshot.outputs.artifact-id }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Refresh YouTube snapshot
        run: node scripts/build/fetch-youtube.mjs

      - name: Prepare YouTube patch
        id: patch
        run: |
          set -eu
          git add -- assets/youtube-latest.json images/youtube
          git diff --cached --binary --full-index > "$RUNNER_TEMP/maintenance.patch"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload YouTube patch
        id: snapshot
        if: ${{ steps.patch.outputs.changed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: youtube-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maintenance.patch
          retention-days: 1
          if-no-files-found: error

  refresh_standings_data:
    name: Refresh standings data
    permissions:
      contents: read
    if: >-
      ${{
        (github.event_name == 'schedule' && contains(fromJSON('["59 23 * * 5", "1 7 * * 1,6"]'), github.event.schedule)) ||
        inputs.task == 'standings'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: standings-fetch
      queue: max
    outputs:
      patch: ${{ steps.patch.outputs.changed }}
      artifact: ${{ steps.snapshot.outputs.artifact-id }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Refresh standings data
        run: npm run build:standings-data

      - name: Prepare standings patch
        id: patch
        run: |
          set -eu
          git add -- standings/standings-cache.json standings/dirty-air-cache.json standings/dirty-air standings/rounds standings/debrief-cache.json
          git diff --cached --binary --full-index > "$RUNNER_TEMP/maintenance.patch"
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload standings patch
        id: snapshot
        if: ${{ steps.patch.outputs.changed == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: standings-refresh-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maintenance.patch
          retention-days: 1
          if-no-files-found: error

  publish_data:
    name: Commit refreshed data
    needs: [refresh_youtube, refresh_standings_data]
    if: >-
      ${{
        !cancelled() &&
        (
          (needs.refresh_youtube.result == 'success' && needs.refresh_youtube.outputs.patch == 'true') ||
          (needs.refresh_standings_data.result == 'success' && needs.refresh_standings_data.outputs.patch == 'true')
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: content-publishing
      queue: max
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout current main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          # Three-way application needs the patch's original blobs if main moved.
          fetch-depth: 0
          persist-credentials: false

      # Each schedule/manual task refreshes exactly one data source. The artifact
      # ID also works when only a failed publishing job is rerun later.
      - name: Download snapshot patch
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.refresh_youtube.outputs.artifact || needs.refresh_standings_data.outputs.artifact }}
          path: ${{ runner.temp }}/maintenance
          merge-multiple: true

      - name: Apply snapshot patch
        env:
          PATCH: ${{ runner.temp }}/maintenance/maintenance.patch
        run: |
          set -eu
          # Merge data against current main instead of copying a stale checkout.
          # A conflicting data update fails this job before anything is pushed.
          git apply --3way --index "$PATCH"

      - name: Commit refreshed data
        id: commit
        uses: ./.github/actions/commit-and-push
        with:
          message: >-
            ${{ needs.refresh_youtube.outputs.patch == 'true' && 'chore(data): refresh youtube snapshot [skip ci]' || 'chore(data): refresh standings snapshots [skip ci]' }}
          token: ${{ github.token }}

  deploy:
    name: Deploy site once
    needs: [changes, publish_blog, publish_data]
    if: >-
      ${{
        !cancelled() &&
        (
          (
            github.event_name == 'push' &&
            needs.changes.result == 'success' &&
            (needs.publish_blog.result == 'success' || needs.publish_blog.result == 'skipped')
          ) ||
          (needs.publish_blog.result == 'success' && needs.publish_blog.outputs.changed == 'true') ||
          (needs.publish_data.result == 'success' && needs.publish_data.outputs.changed == 'true')
        )
      }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
    with:
      artifact_ready: ${{ needs.publish_blog.outputs.artifact_ready == 'true' }}
