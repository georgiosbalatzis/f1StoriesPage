name: Security Headers

# Checks the live site's response headers against scripts/build/security-policy.mjs
# (npm run security:headers). Fails only on drift, or on a header the hosting
# layer could serve but does not; GitHub Pages' own limits are reported.

on:
  workflow_dispatch:
    inputs:
      strict:
        description: 'Also fail on headers the hosting layer cannot serve'
        type: boolean
        default: false
  schedule:
    - cron: '17 5 * * 1' # Mondays

permissions:
  contents: read

jobs:
  verify:
    name: Verify production headers
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: '22'

      # The verifier imports only scripts/build/security-policy.mjs; no npm install.
      - name: Verify https://f1stories.gr
        env:
          STRICT: ${{ inputs.strict && '--strict' || '' }}
        run: |
          status=0
          node scripts/quality/security-headers-verify.mjs $STRICT > report.txt 2>&1 || status=$?
          cat report.txt
          { echo '```'; cat report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
