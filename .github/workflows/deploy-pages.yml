name: Deploy Pages

on:
  workflow_call:
    inputs:
      mode:
        description: 'Publishing mode (ARTICLE_FAST_PATH or FULL_RELEASE)'
        required: false
        default: 'FULL_RELEASE'
        type: string
  # Site Maintenance owns main pushes, including mixed content/code changes.
  workflow_dispatch:
  # Each aggregate build refreshes TYRES schedules and forecasts. Owner cadence (2026-11-02): every 6 h
  # Thursday–Monday (race weekends), once a day Tuesday–Wednesday. Scheduled runs stop at the gate below
  # unless aggregation is enabled.
  schedule:
    - cron: '41 */6 * * 0,1,4,5,6'
    - cron: '41 6 * * 2,3'

# Granted per job: only the deploy job can publish Pages or mint an OIDC token.
permissions: {}

# Latest main always deploys. Every run builds main as it is when its build job starts, and runs queue instead of
# cancelling: the running deploy finishes, the newest arrival replaces any older pending one and then builds the
# newest main and TYRES data. Every change to main is followed by a call or dispatch of this workflow, so the last
# run always deploys it. (cancel-in-progress let a run that arrived late with an older, prebuilt artifact cancel a
# newer build on 2026-11-02.)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gate:
    name: Scheduled refresh gate
    if: ${{ github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.lock.outputs.enabled }}
    steps:
      - name: Checkout the source lock
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: scripts/deployment/sources.json
          sparse-checkout-cone-mode: false
      - name: Read aggregation state
        id: lock
        run: echo "enabled=$(jq -r '.enabled == true' scripts/deployment/sources.json)" >> "$GITHUB_OUTPUT"

  build:
    name: Build Pages artifact
    needs: gate
    if: ${{ !cancelled() && (github.event_name != 'schedule' || needs.gate.outputs.enabled == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site (GET /repos/{repo}/pages)
    env:
      F1S_PUBLISH_MODE: ${{ inputs.mode == 'ARTICLE_FAST_PATH' && 'ARTICLE_FAST_PATH' || 'FULL_RELEASE' }}
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/build-pages

  deploy:
    name: Deploy Pages artifact
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
