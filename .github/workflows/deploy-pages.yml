name: Deploy Pages

on:
  workflow_call:
  # Site Maintenance owns main pushes, including mixed content/code changes.
  workflow_dispatch:

# Granted per job: only the deploy job can publish Pages or mint an OIDC token.
permissions: {}

concurrency:
  group: pages
  queue: max

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site (GET /repos/{repo}/pages)
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Read assembly mode
        id: assembly
        run: node -e 'const fs = require("node:fs"); const c = require("./scripts/deployment/sources.json"); fs.appendFileSync(process.env.GITHUB_OUTPUT, "enabled=" + c.enabled + "\n");'

      - name: Reuse optimized article images
        if: steps.assembly.outputs.enabled != 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .build/public-images
          key: public-images-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build/public-article-images.mjs') }}-${{ hashFiles('package-lock.json', 'blog-module/blog-entries/**/*.webp', 'blog-module/blog-entries/**/*.avif') }}
          restore-keys: |
            public-images-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/build/public-article-images.mjs') }}-

      - name: Build public artifact
        if: steps.assembly.outputs.enabled != 'true'
        run: npm run build:public

      - name: Build pinned aggregate artifact
        if: steps.assembly.outputs.enabled == 'true'
        run: |
          node scripts/deployment/build.mjs --output .build/priority6/site --reports .build/priority6/reports
          rm -rf dist
          mv .build/priority6/site dist

      - name: Run static source guard
        run: npm run quality:static

      - name: Audit runtime dependencies
        run: npm run audit:runtime

      - name: Install integration browser
        if: steps.assembly.outputs.enabled == 'true'
        run: node_modules/.bin/playwright-core install --with-deps chromium

      - name: Smoke test canonical artifact
        if: steps.assembly.outputs.enabled == 'true'
        run: npm run test:integration -- --site dist --reports .build/priority6/reports

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: Deploy Pages artifact
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
