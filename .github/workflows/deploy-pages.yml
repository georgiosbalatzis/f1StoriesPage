name: Deploy Pages

on:
  workflow_call:
    inputs:
      artifact_ready:
        description: A trusted caller already validated and uploaded the Pages artifact in this run.
        required: false
        type: boolean
        default: false
  # Site Maintenance owns main pushes, including mixed content/code changes.
  workflow_dispatch:

# Granted per job: only the deploy job can publish Pages or mint an OIDC token.
permissions: {}

concurrency:
  group: pages
  queue: max

jobs:
  build:
    name: Build Pages artifact
    if: ${{ !inputs.artifact_ready }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      pages: read # configure-pages reads the Pages site (GET /repos/{repo}/pages)
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/build-pages

  deploy:
    name: Deploy Pages artifact
    needs: build
    if: ${{ !cancelled() && (needs.build.result == 'success' || (inputs.artifact_ready && needs.build.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
