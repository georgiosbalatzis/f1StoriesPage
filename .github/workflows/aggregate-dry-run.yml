name: Ecosystem dry run

on:
  workflow_dispatch:

# Deliberately no Pages/OIDC/write permissions and no deploy job.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup
      - run: npm run test:deployment
      # Before the build: TYRES renders its social cards and panel images with Chromium.
      - name: Install integration browser
        run: node_modules/.bin/playwright-core install --with-deps chromium
      - run: npm run build:ecosystem -- --node-bin "$F1S_NODE_BIN"
      - run: npm run test:integration -- --site .build/priority6/site --reports .build/priority6/reports
      - name: Upload reviewable artifact and evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: f1stories-aggregate-dry-run
          include-hidden-files: true
          path: .build/priority6/
