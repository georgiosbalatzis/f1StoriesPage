name: Merge Dependency Updates

on:
  workflow_run:
    workflows: ['Site Quality']
    types: [completed]
    branches: ['dependabot/**']

permissions: {}

jobs:
  merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      # Never check out or execute PR code in this privileged workflow.
      - name: Merge tested Dependabot PR
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$number" ]; then
            echo "No PR attached to this run."
            exit 0
          fi

          if ! gh api "repos/$REPO/pulls/$number" | jq -e --arg repo "$REPO" --arg sha "$TESTED_SHA" '
            .state == "open" and .draft == false and
            .user.login == "dependabot[bot]" and
            .base.ref == "main" and .base.repo.full_name == $repo and
            .head.repo.full_name == $repo and
            (.head.ref | startswith("dependabot/")) and .head.sha == $sha
          ' > /dev/null; then
            echo "PR is no longer eligible for automatic merging."
            exit 0
          fi

          gh pr merge "$number" --repo "$REPO" --merge --delete-branch --match-head-commit "$TESTED_SHA"
          echo "merged=true" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN merges do not trigger the normal push deployment.
  deploy:
    needs: merge
    if: ${{ needs.merge.outputs.merged == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
