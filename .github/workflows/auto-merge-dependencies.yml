name: Merge Dependency Updates

on:
  workflow_run:
    workflows: ['Site Quality']
    types: [completed]
    branches: ['dependabot/**']

permissions: {}

# Do not race two successful dependency PRs against the same main commit.
concurrency:
  group: dependabot-merge-${{ github.repository }}
  queue: max

jobs:
  merge:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    outputs:
      merged: ${{ steps.merge.outputs.merged }}
    steps:
      # Never check out or execute PR code in this privileged workflow.
      - name: Merge tested Dependabot PR
        id: merge
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          number="$(jq -r '.workflow_run.pull_requests[0].number // empty' "$GITHUB_EVENT_PATH")"
          if [ -z "$number" ]; then
            echo "No PR attached to this run."
            exit 0
          fi

          pr_json="$(gh api "repos/$REPO/pulls/$number")"
          # The named npm groups are limited to minor and patch in dependabot.yml.
          # Other PRs must use a matching npm branch and stable version pair in the title.
          if ! printf '%s' "$pr_json" | jq -e --arg repo "$REPO" --arg sha "$TESTED_SHA" '
            def grouped_npm:
              . as $pr | ["dev-tooling", "build-runtime"] | any(. as $group |
                ($pr.head.ref | test("^dependabot/npm_and_yarn/" + $group + "-[0-9a-f]{10}$")) and
                ($pr.title | test("^chore\\(deps\\): bump the " + $group + " group with [1-9][0-9]* updates?$")));
            def single_npm:
              def version: "(?:0|[1-9][0-9]{0,8})" | . + "\\." + . + "\\." + .;
              def parts: split(".") | map(tonumber);
              .head.ref as $branch |
              ((.title | capture("^chore\\(deps\\): bump (?<name>(?:@[a-z0-9._-]+/)?[a-z0-9._-]+) from (?<old>" + version + ") to (?<new>" + version + ")$")) // null) as $update |
              if $update == null then false else
                ($update.old | parts) as $old | ($update.new | parts) as $new |
                $branch == ("dependabot/npm_and_yarn/" + ($update.name | ltrimstr("@")) + "-" + $update.new) and
                $old[0] == $new[0] and $old < $new
              end;
            .state == "open" and .draft == false and
            .user.login == "dependabot[bot]" and
            .base.ref == "main" and .base.repo.full_name == $repo and
            .head.repo.full_name == $repo and
            (.head.ref | startswith("dependabot/")) and .head.sha == $sha and
            (.title | type == "string") and (grouped_npm or single_npm) and
            (.changed_files == 1 or .changed_files == 2)
          ' > /dev/null; then
            echo "PR is no longer eligible for automatic merging."
            exit 0
          fi

          changed_files="$(printf '%s' "$pr_json" | jq '.changed_files')"
          files="$(gh api "repos/$REPO/pulls/$number/files?per_page=100")"
          if ! printf '%s' "$files" | jq -e --argjson count "$changed_files" '
            type == "array" and length == $count and
            all(.[]; .status == "modified" and (.filename == "package.json" or .filename == "package-lock.json")) and
            (map(.filename) | unique | length == $count)
          ' > /dev/null; then
            echo "PR #$number must change only npm package files to merge automatically."
            exit 0
          fi

          # Grouped and transitive updates can still cross a major version inside the lockfile.
          base_sha="$(printf '%s' "$pr_json" | jq -r '.base.sha')"
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/package-lock.json?ref=$base_sha" > "$RUNNER_TEMP/base-lock.json"
          gh api -H 'Accept: application/vnd.github.raw+json' "repos/$REPO/contents/package-lock.json?ref=$TESTED_SHA" > "$RUNNER_TEMP/head-lock.json"
          if ! jq -n -e --slurpfile base "$RUNNER_TEMP/base-lock.json" --slurpfile head "$RUNNER_TEMP/head-lock.json" '
            def majors: [.packages | to_entries[] | select(.value.version != null) | {
              name: (.value.name // (.key | sub("^.*node_modules/"; ""))),
              major: (.value.version | tostring | (capture("^(?<m>0|[1-9][0-9]*)\\.").m // .))
            }];
            if ($base | length) != 1 or ($head | length) != 1 then false
            elif ($base[0].packages | type) != "object" or ($head[0].packages | type) != "object" then false
            else
              (reduce ($base[0] | majors[]) as $p ({}; .[$p.name] += [$p.major])) as $known |
              $head[0] | majors | all(.[]; . as $p | ($known[$p.name] // []) as $seen |
                ($seen | length) == 0 or ($seen | any(.[]; . == $p.major)))
            end
          ' > /dev/null; then
            echo "PR #$number moves a package-lock.json entry to a new major version."
            exit 0
          fi

          if ! merge_output="$(gh pr merge "$number" --repo "$REPO" --merge --delete-branch --match-head-commit "$TESTED_SHA" 2>&1)"; then
            case "$merge_output" in
              *"is not mergeable: the merge commit cannot be cleanly created"*)
                echo "PR #$number conflicts with the current base; leaving it open for Dependabot to rebase."
                exit 0
                ;;
              *)
                printf '%s\n' "$merge_output" >&2
                exit 1
                ;;
            esac
          fi
          echo "merged=true" >> "$GITHUB_OUTPUT"

  # GITHUB_TOKEN merges do not trigger the normal push deployment.
  deploy:
    needs: merge
    if: ${{ needs.merge.outputs.merged == 'true' }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
