name: Intelligence Health

on:
  schedule:
    # 8h and 14h after 03:00 Athens: tolerate the observed ~5.5h GitHub scheduling delay.
    # Missing runs warn after 8h and become critical after 12h; DST uses the same local-time syntax as the producer.
    - cron: '0 11 * * *'
      timezone: Europe/Athens
    - cron: '0 17 * * *'
      timezone: Europe/Athens
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Print incident decisions without writing Issues'
        type: boolean
        required: true
        default: true

permissions: {}

concurrency:
  group: intelligence-health
  cancel-in-progress: false

jobs:
  assess:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Read and assess operational evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/intelligence/health-check.mjs --dry-run --json --out="$RUNNER_TEMP/health-evidence.json"
      - name: Upload safe operational evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: intelligence-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/health-evidence.json
          retention-days: 7
          if-no-files-found: error

  incidents:
    needs: assess
    if: ${{ always() && github.ref == 'refs/heads/main' && needs.assess.result != 'skipped' && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - name: Checkout main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Download this attempt’s evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: intelligence-health-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/health
      - name: Reconcile incidents (or print the plan)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && '--dry-run' || '' }}
        run: node scripts/intelligence/health-check.mjs --incidents="$RUNNER_TEMP/health/health-evidence.json" $DRY_RUN
