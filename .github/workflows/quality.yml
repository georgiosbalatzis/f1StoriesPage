name: Site Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Build public artifact
        if: >-
          ${{
            !startsWith(github.head_ref, 'author/blog/') &&
            !startsWith(github.head_ref, 'author/import/') &&
            !startsWith(github.head_ref, 'author/delete/') &&
            !startsWith(github.head_ref, 'author/edit/')
          }}
        run: npm run build:public

      - name: Validate author content
        if: >-
          ${{
            startsWith(github.head_ref, 'author/blog/') ||
            startsWith(github.head_ref, 'author/import/') ||
            startsWith(github.head_ref, 'author/delete/') ||
            startsWith(github.head_ref, 'author/edit/')
          }}
        run: npm run build:html && npm run build:blog && npm run build:assets && npm run build:data-contracts

      - name: Run static source guard
        run: npm run quality:static

      - name: Audit runtime dependencies
        if: >-
          ${{
            !startsWith(github.head_ref, 'author/blog/') &&
            !startsWith(github.head_ref, 'author/import/') &&
            !startsWith(github.head_ref, 'author/delete/') &&
            !startsWith(github.head_ref, 'author/edit/')
          }}
        run: npm run audit:runtime

      - name: Run author module tests
        run: npm run test:author

      - name: Run standings module tests
        run: npm run test:standings

      - name: Run security policy tests
        run: npm run test:security
