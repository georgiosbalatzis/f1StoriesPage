name: Site Quality

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

# Independent suites run as parallel jobs. "Quality gates" is the single check that publishing
# (workflow_run consumers) and reviewers rely on: it fails unless every suite job succeeded.
jobs:
  # Suites that read only tracked source and fixtures: proven to give identical results without a build.
  source:
    name: Source suites
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Run race desk contract tests
        run: npm run test:race-desk

      - name: Test isolated research prototype (DEMO and mocked provider only)
        run: npm run test:research

      - name: Run standings module tests
        run: npm run test:standings

      - name: Run countdown schedule tests
        run: node --test scripts/build/__tests__/countdown-schedule.test.mjs scripts/build/__tests__/race-calendar.test.mjs

      - name: Run visual focus capture regression
        run: node --test scripts/perf/__tests__/visual-qa-focus.test.mjs scripts/perf/__tests__/embed-qa.test.mjs scripts/perf/__tests__/size-budget.test.mjs

      - name: Run security policy tests
        run: npm run test:security

      - name: Run dashboard snapshot tests (synthetic data and generated keys only, no network)
        run: npm run test:intelligence && npm run test:dashboard:browser

      - name: Run aggregate deployment gate tests
        run: npm run test:deployment

      - name: Run tablet CLS guard tests
        run: node --test scripts/build/__tests__/tablet-cls.test.mjs

  # These suites serve or read generated files (minified bundles, asset manifest, stamped HTML),
  # so they run on the same built tree as before the split.
  built:
    name: Author and publishing suites
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: ./.github/actions/restore-article-images

      - name: Build public artifact
        run: npm run build:public

      - name: Run author module tests
        run: npm run test:author

      - name: Run publishing regression tests
        run: node --test scripts/build/__tests__/social-cards.test.mjs scripts/build/__tests__/disqus-removal.test.mjs scripts/build/__tests__/public-artifact-refs.test.mjs scripts/build/__tests__/public-article-images.test.mjs scripts/build/__tests__/public-media-integrity.test.mjs scripts/build/__tests__/media-qa.test.mjs scripts/build/__tests__/image-variant-demand.test.mjs scripts/build/__tests__/publication-routing.test.mjs scripts/build/__tests__/maintenance-patch.test.mjs scripts/build/__tests__/quality-routing.test.mjs scripts/build/__tests__/pages-preparation.test.mjs scripts/build/__tests__/maintenance-schedules.test.mjs scripts/build/__tests__/icon-sprite.test.mjs scripts/build/__tests__/edition-prerequisites.test.mjs

  artifact:
    name: Public artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Compare the tested PR merge with its base parent without full history.
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Classify changed files
        id: changes
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/build/classify-quality.mjs

      - uses: ./.github/actions/restore-article-images

      # Content-only PRs also need dist/ for artifact URL contract tests.
      - name: Build public artifact
        run: npm run build:public

      - name: Run static source guard
        run: npm run quality:static

      - name: Verify asset size budgets
        run: npm run perf:budget

      - name: Verify generated editorial media
        run: npm run qa:media -- --root=${{ steps.changes.outputs.content_only == 'true' && '.' || 'dist' }}

      - name: Verify release media and primary domain
        if: ${{ steps.changes.outputs.content_only != 'true' }}
        run: node --test scripts/build/__tests__/editorial-media-release.test.mjs scripts/build/__tests__/primary-domain.test.mjs scripts/build/__tests__/social-cards-release.test.mjs

      - name: Audit runtime dependencies
        if: ${{ steps.changes.outputs.content_only != 'true' }}
        run: npm run audit:runtime

      # Needs dist/: its URL contract tests skip artifact assertions without it.
      - name: Run blog module tests
        run: npm run test:blog

      - name: Verify next-race countdown
        run: npm run qa:countdown -- --root=${{ steps.changes.outputs.content_only == 'true' && '.' || 'dist' }}

      - name: Verify Race Desk navigation and offline URL compatibility
        if: ${{ steps.changes.outputs.content_only != 'true' }}
        run: npm run test:race-desk:browser -- --site dist --reports .build/race-desk-r02c

      - name: Upload Race Desk navigation diagnostics
        if: ${{ !cancelled() && steps.changes.outputs.content_only != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: race-desk-navigation-reports
          path: .build/race-desk-r02c/
          if-no-files-found: warn

      - name: Verify static Grand Prix pilot pages
        if: ${{ steps.changes.outputs.content_only != 'true' }}
        run: npm run test:race-desk:hubs -- --site dist --reports .build/race-desk-r03

      - name: Upload Grand Prix pilot diagnostics
        if: ${{ !cancelled() && steps.changes.outputs.content_only != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: race-desk-gp-reports
          path: .build/race-desk-r03/
          if-no-files-found: warn

  browser:
    name: Browser regressions
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Classify changed files
        id: changes
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/build/classify-quality.mjs

      - name: Restore optimized article images
        if: ${{ steps.changes.outputs.content_only != 'true' }}
        uses: ./.github/actions/restore-article-images

      - name: Build public artifact for browser regressions
        if: ${{ steps.changes.outputs.content_only != 'true' }}
        run: npm run build:public

      # ubuntu-latest supplies Chrome and its runtime libraries; use that browser
      # through chrome-launcher rather than downloading Playwright binaries.
      - name: Run Edition discovery regression
        if: ${{ steps.changes.outputs.content_only != 'true' }}
        run: npm run qa:edition

      - name: Run consent and RUM regressions
        if: ${{ steps.changes.outputs.content_only != 'true' }}
        run: npm run test:consent && npm run test:rum:browser

      - name: Run tablet CLS regression (both themes, edition font swap)
        if: ${{ steps.changes.outputs.content_only != 'true' }}
        run: npm run perf:cls-tablet -- --widths 768

  gates:
    name: Quality gates
    needs: [source, built, artifact, browser]
    # Always report a conclusion: a skipped or cancelled suite must never read as a pass.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every suite job to succeed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -c 'map_values(.result)'
          echo "$NEEDS" | jq -e 'length == 4 and all(.[]; .result == "success")' > /dev/null
