  <style>
    :root { --paper: #f2eee4; --ink: #20251f; --muted: #5b6256; --accent: #a82e1c; --line: #c8c8b9; --signal: #ed4c32; --signal-ink: #17191b; --cta-bg: #20251f; --cta-text: #f2eee4; }
    :root:not([data-theme="light"]) { --paper: #1b1a19; --ink: #eee8db; --muted: #b6bbac; --accent: #ff775f; --line: #4b5146; --cta-bg: #eee8db; --cta-text: #20251f; }
    * { box-sizing: border-box; } body { margin: 0; min-height: 100svh; background: var(--paper); color: var(--ink); font-family: "IBM Plex Sans", sans-serif; }
    .page { width: min(1200px, 100%); min-height: 100svh; margin: auto; padding: clamp(24px, 5vw, 64px) clamp(22px, 6vw, 86px); display: grid; grid-template-rows: auto 1fr auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-bottom: 14px; border-bottom: 1px solid var(--line); } .brand { display: inline-flex; align-items: center; gap: 11px; min-height: 44px; color: inherit; font: 700 1.75rem/1 "Barlow Condensed", sans-serif; letter-spacing: -.035em; text-decoration: none; } .brand img { width: 38px; height: 38px; object-fit: contain; } .signal { color: var(--signal); } .issue { color: var(--muted); font-size: .75rem; font-weight: 500; letter-spacing: .11em; }
    main { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: clamp(32px, 8vw, 120px); padding: 8vh 0; } .kicker { margin: 0; color: var(--muted); font-size: .75rem; font-weight: 600; letter-spacing: .13em; }
    h1 { max-width: 680px; margin: 18px 0 20px; font: 600 clamp(2.5rem, 6vw, 4.5rem)/1.15 "IBM Plex Sans", sans-serif; letter-spacing: -.025em; } .message { max-width: 480px; margin: 0; color: var(--muted); font-size: 1.125rem; line-height: 1.6; }
    .actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 24px; margin-top: 32px; } a.button { display: inline-flex; min-height: 47px; align-items: center; padding: 0 22px; border-radius: 2px; background: var(--cta-bg); color: var(--cta-text); font-size: .875rem; font-weight: 600; text-decoration: none; } a.button:hover { background: var(--signal); color: var(--signal-ink); } a.link { display: inline-flex; min-height: 44px; align-items: center; border-bottom: 1px solid currentColor; color: var(--ink); font-size: .875rem; font-weight: 600; text-decoration: none; } a.link:hover { color: var(--accent); } :is(a.button, a.link, .brand):focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .numeral { color: var(--line); font: 700 clamp(6rem, 16vw, 13rem)/.8 "Barlow Condensed", sans-serif; letter-spacing: -.03em; }
    footer { display: flex; justify-content: space-between; gap: 16px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--muted); font-size: .75rem; letter-spacing: .08em; }
    @media (max-width: 680px) { main { grid-template-columns: 1fr; align-content: start; gap: 24px; padding: 6vh 0; } .numeral { order: -1; font-size: 6rem; } .issue { display: none; } }
