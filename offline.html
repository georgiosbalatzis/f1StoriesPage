<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Χωρίς σύνδεση | F1 Stories</title>
  <script src="/scripts/perf/error-beacon.min.js?v=59367e85"></script>
    <script src="/scripts/theme-init.min.js?v=a55f63a7"></script>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="stylesheet" href="/styles/home-fonts.min.css?v=bc876546">
  <style>
    /* Editorial tokens (styles/editorial.css), inlined so the page renders from the SW cache alone. */
    :root { --bg: #1b1a19; --text: #eee8db; --muted: #b6bbac; --border: #4b5146; --accent: #ff775f; --signal: #ed4c32; --signal-ink: #17191b; --cta-bg: #eee8db; --cta-text: #20251f; }
    :root[data-theme="light"] { --bg: #f2eee4; --text: #20251f; --muted: #5b6256; --border: #c8c8b9; --accent: #a82e1c; --cta-bg: #20251f; --cta-text: #f2eee4; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100svh; background: var(--bg); color: var(--text); font-family: "IBM Plex Sans", system-ui, sans-serif; line-height: 1.6; }
    .page { width: min(760px, 100%); margin: 0 auto; padding: clamp(24px, 5vw, 56px) clamp(22px, 5vw, 48px) calc(40px + env(safe-area-inset-bottom, 0px)); }
    .brand { display: inline-flex; align-items: center; gap: 11px; min-height: 44px; color: inherit; text-decoration: none; }
    .brand img { width: 38px; height: 38px; }
    .brand span { font: 700 1.75rem/1 "Barlow Condensed", sans-serif; letter-spacing: -.035em; }
    .signal { color: var(--signal); }
    .folio { display: flex; justify-content: space-between; gap: 16px; margin: 28px 0 0; padding-top: 11px; border-top: 1px solid var(--border); font-size: .75rem; font-weight: 500; letter-spacing: .11em; color: var(--muted); }
    h1 { margin: clamp(40px, 9vh, 88px) 0 18px; font: 600 clamp(2.5rem, 6vw, 4.5rem)/1.15 "IBM Plex Sans", sans-serif; letter-spacing: -.025em; }
    .message { max-width: 52ch; color: var(--muted); font-size: 1.125rem; }
    .retry { display: inline-flex; align-items: center; min-height: 47px; margin-top: 32px; padding: 0 22px; border: 0; border-radius: 2px; background: var(--cta-bg); color: var(--cta-text); font: 600 .875rem/1 "IBM Plex Sans", sans-serif; cursor: pointer; }
    .retry:hover { background: var(--signal); color: var(--signal-ink); }
    :is(.retry, .brand, .cached-list a):focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .cached-section { margin-top: 56px; }
    .cached-title { padding-bottom: 10px; border-bottom: 1px solid var(--border); font-size: .75rem; font-weight: 600; letter-spacing: .13em; color: var(--muted); }
    .cached-list { list-style: none; }
    .cached-list li { border-bottom: 1px solid var(--border); }
    .cached-list a { display: flex; align-items: center; min-height: 52px; padding: 10px 0; color: var(--text); text-decoration: none; font-weight: 500; }
    .cached-list a:hover { color: var(--accent); }
    #no-cached { display: none; padding-top: 14px; color: var(--muted); font-size: .875rem; }
  </style>
</head>
<body>
  <div class="page">
    <a class="brand" href="/"><img src="/images/logo-256.webp" alt="" width="256" height="256" decoding="async"><span>F1 STORIES<span class="signal">.</span></span></a>
    <div class="folio"><span>F1 STORIES / ΕΚΤΟΣ ΣΥΝΔΕΣΗΣ</span></div>

    <main aria-labelledby="offline-title">
      <h1 id="offline-title">Χωρίς σύνδεση<span class="signal">.</span></h1>
      <p class="message">Δεν υπάρχει σύνδεση στο διαδίκτυο. Έλεγξε το δίκτυό σου και δοκίμασε ξανά.</p>
      <button class="retry" type="button" data-reload-page>Δοκίμασε ξανά</button>

      <section class="cached-section" id="cached-section" style="display:none;" aria-labelledby="cached-title">
        <h2 class="cached-title" id="cached-title">ΑΠΟΘΗΚΕΥΜΕΝΑ ΑΡΘΡΑ</h2>
        <ul class="cached-list" id="cached-list"></ul>
        <p id="no-cached">Δεν υπάρχουν ακόμη αποθηκευμένα άρθρα. Όσα διαβάζεις με σύνδεση μένουν διαθέσιμα εδώ.</p>
      </section>
    </main>
  </div>

  <script src="/scripts/offline-page.min.js?v=09b8658d"></script>
</body>
</html>
